services:
  # Redis for caching and queues
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - app-network

  # MySQL database (optional - comment out if using SQLite)
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret_root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-expenser}
      MYSQL_USER: ${DB_USERNAME:-expenser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-secret_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Main application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    ports:
      - "${APP_PORT:-8183}:80"
    environment:
      APP_NAME: "${APP_NAME:-RemoteRaven}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:${APP_PORT:-8183}}"

      # Database - SQLite (default)
      DB_CONNECTION: "${DB_CONNECTION:-sqlite}"
      DB_DATABASE: "${DB_DATABASE:-/var/www/html/database/database.sqlite}"

      # Database - MySQL (uncomment to use)
      # DB_CONNECTION: mysql
      # DB_HOST: mysql
      # DB_PORT: 3306
      # DB_DATABASE: "${DB_DATABASE:-expenser}"
      # DB_USERNAME: "${DB_USERNAME:-expenser}"
      # DB_PASSWORD: "${DB_PASSWORD:-secret_password}"

      # Cache & Queue - Redis (recommended)
      CACHE_STORE: "${CACHE_STORE:-redis}"
      SESSION_DRIVER: "${SESSION_DRIVER:-redis}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-redis}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"

      # Filesystem
      FILESYSTEM_DISK: public

      # Logging
      LOG_CHANNEL: stack
      LOG_LEVEL: "${LOG_LEVEL:-error}"

      # Mail
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hello@remoteraven.com}"
      MAIL_FROM_NAME: "${APP_NAME:-RemoteRaven}"

      # Performance
      OPCACHE_VALIDATE_TIMESTAMPS: "${OPCACHE_VALIDATE_TIMESTAMPS:-0}"
      OPCACHE_REVALIDATE_FREQ: "${OPCACHE_REVALIDATE_FREQ:-0}"

    volumes:
      - db_data:/var/www/html/database
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    depends_on:
      redis:
        condition: service_healthy
      # Uncomment if using MySQL
      # mysql:
      #   condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  app_storage:
  app_logs:
  redis_data:
  mysql_data:
